events {
    worker_connections 1024;
}

http {
    # Define the cluster of three backend instances
    upstream backend_cluster {
        # Round-robin distribution with instant 1-fail detection
        server backend-1:5000 max_fails=1 fail_timeout=5s;
        server backend-2:5000 max_fails=1 fail_timeout=5s;
        server backend-3:5000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # --- ZERO-DOWNTIME FAILOVER DIRECTIVES (QUESTION 1C: AFTER) ---
            # If an instance drops, times out, or returns 502/503/504,
            # Nginx immediately retries the request on another healthy backend
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;

            # Pass standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass through the custom instance identifier header
            proxy_pass_header X-Served-By;
        }
    }
}
