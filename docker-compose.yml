services:
  # Backend Instance 1
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: retail-backend:latest
    container_name: retail-backend-1
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-1
      - CLIENT_URL=http://localhost:5173
      - SUPABASE_URL=https://hxekfsyuokklfiexgmpf.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4ZWtmc3l1b2trbGZpZXhnbXBmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODcxMTU2MSwiZXhwIjoyMTA0Mjg3NTYxfQ.6ue4-0OmQozkjjhcsVw2TdZYVBguNTYAoAK6RYTgSiE
    ports:
      - "5001:5000"
    networks:
      - retail-network

  # Backend Instance 2 (reuses the same image)
  backend-2:
    image: retail-backend:latest
    container_name: retail-backend-2
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-2
      - CLIENT_URL=http://localhost:5173
      - SUPABASE_URL=https://hxekfsyuokklfiexgmpf.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4ZWtmc3l1b2trbGZpZXhnbXBmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODcxMTU2MSwiZXhwIjoyMTA0Mjg3NTYxfQ.6ue4-0OmQozkjjhcsVw2TdZYVBguNTYAoAK6RYTgSiE
    ports:
      - "5002:5000"
    depends_on:
      - backend-1
    networks:
      - retail-network

  # Backend Instance 3 (reuses the same image)
  backend-3:
    image: retail-backend:latest
    container_name: retail-backend-3
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-3
      - CLIENT_URL=http://localhost:5173
      - SUPABASE_URL=https://hxekfsyuokklfiexgmpf.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4ZWtmc3l1b2trbGZpZXhnbXBmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODcxMTU2MSwiZXhwIjoyMTA0Mjg3NTYxfQ.6ue4-0OmQozkjjhcsVw2TdZYVBguNTYAoAK6RYTgSiE
    ports:
      - "5003:5000"
    depends_on:
      - backend-1
    networks:
      - retail-network

  # Nginx Load Balancer
  nginx-lb:
    image: nginx:alpine
    container_name: retail-nginx-lb
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - retail-network

networks:
  retail-network:
    driver: bridge
